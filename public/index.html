<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Lab – Operating Systems, Animated</title>
<meta name="description" content="Interactive, step-by-step animations of operating-system concepts (SC2005), plus a formula sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: chapter sidebar + study area; each section = a "why" card + an animation player with controls */
:root{
  --bg:#eef2f5; --panel:#ffffff; --panel2:#f6f8fa; --ink:#132033; --muted:#5a6a7e; --line:#d5dde6;
  --acc:#0b7fa8; --acc-soft:#dff1f8; --hl:#e08a00; --hl-soft:#fff1d6; --ok:#1f9d55; --ok-soft:#dcf5e6; --bad:#d23c3c; --bad-soft:#fde3e3;
  --kern:#efe8fb; --kern-line:#b9a6e6; --user:#e6f4ee; --user-line:#9fd2b8; --hw:#eef0f3;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --dur:450ms; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c121b; --panel:#131c28; --panel2:#182333; --ink:#e4ecf5; --muted:#93a4ba; --line:#28374b;
  --acc:#3cb6e3; --acc-soft:#123446; --hl:#f2a93b; --hl-soft:#3a2a10; --ok:#3ccf7d; --ok-soft:#113424; --bad:#ff6b6b; --bad-soft:#3d1717;
  --kern:#231c38; --kern-line:#5e4a96; --user:#13291f; --user-line:#2f6b4f; --hw:#1b2431; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c121b; --panel:#131c28; --panel2:#182333; --ink:#e4ecf5; --muted:#93a4ba; --line:#28374b;
  --acc:#3cb6e3; --acc-soft:#123446; --hl:#f2a93b; --hl-soft:#3a2a10; --ok:#3ccf7d; --ok-soft:#113424; --bad:#ff6b6b; --bad-soft:#3d1717;
  --kern:#231c38; --kern-line:#5e4a96; --user:#13291f; --user-line:#2f6b4f; --hw:#1b2431; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
code,.mono{font-family:var(--f-mono);font-size:.92em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.01em;padding:0 8px 4px}
.brand span{color:var(--acc)}
.brand-sub{color:var(--muted);font-size:12.5px;padding:0 8px 14px}
nav.side a{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:start;padding:8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
nav.side a .n{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:2px}
nav.side a:hover{background:var(--panel2)}
nav.side a.on{background:var(--acc-soft);color:var(--ink);font-weight:600}
nav.side a.on .n{color:var(--acc)}
.side-tools{margin-top:16px;padding:10px 8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.side-tools label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
main{padding:22px clamp(16px,3vw,40px) 80px;max-width:1180px;width:100%}
.mtop{display:none}
.ch-head{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.ch-num{font-family:var(--f-mono);font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em}
h1{font-size:30px;line-height:1.15;margin:2px 0 6px;letter-spacing:-.015em;text-wrap:balance}
.ch-lead{color:var(--muted);max-width:75ch;margin:0 0 14px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 22px}
.toc a{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;background:var(--panel)}
.toc a:hover{border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin:0 0 22px}
.card h2{font-size:19px;margin:0 0 10px;letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline;text-wrap:balance}
.card h2 .sn{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-weight:500}
.why{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--panel2);border-left:3px solid var(--hl);border-radius:6px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.why b.k{color:var(--hl);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.why p{margin:0}
.exam{background:var(--acc-soft);border-radius:6px;padding:8px 12px;font-size:13.5px;margin:12px 0 0}
.exam b:first-child{color:var(--acc)}
/* player */
.player{border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden}
.player:focus{outline:none}.player:focus-visible{outline:2px solid var(--acc)}
.p-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.p-top:empty{display:none}
.p-top label{display:flex;gap:6px;align-items:center;color:var(--muted)}
.p-top select,.p-top input[type=number],.p-top input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--ink)}
.p-top input[type=number]{width:70px}
.p-viz{padding:12px;overflow-x:auto;background:var(--panel)}
.p-act{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.p-act:empty{display:none}
.p-msg{min-height:58px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel);font-size:14.5px}
.p-msg .why-chip{display:inline-block;font-size:11px;font-weight:700;background:var(--hl-soft);color:var(--hl);border-radius:4px;padding:0 6px;margin-right:6px;text-transform:uppercase;letter-spacing:.04em}
.p-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.pb{min-width:36px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.pb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.pb:disabled{opacity:.4;cursor:default}
.pb.play{background:var(--acc);color:#fff;border-color:var(--acc);min-width:44px}
.pb.play:hover{color:#fff;filter:brightness(1.08)}
.p-bar input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}
.p-cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:78px;text-align:right}
.p-spd{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.p-spd select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:13.5px}
.btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.warn{border-color:var(--hl);color:var(--hl)}
/* stage */
.stage{position:relative;width:100%;overflow:hidden}
.stage-in{position:absolute;left:0;top:0;transform-origin:0 0}
.stage-svg{position:absolute;left:0;top:0;overflow:visible}
.sbox{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;line-height:1.25;border-radius:7px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:3px 6px;
  transition:transform var(--dur) cubic-bezier(.4,.1,.2,1),width var(--dur),height var(--dur),background-color var(--dur),border-color var(--dur),opacity var(--dur),box-shadow var(--dur),color var(--dur)}
.sbi{width:100%;max-height:100%}
.sbox.code .sbi,.sbox.lbl.l .sbi,.sbox.zone .sbi,.sbox.ttl .sbi{text-align:left}
.sbox.tok.sq{border-radius:5px}
.ccs-ph .chip{color:var(--ink)}
.sbox.lbl{border:none;background:none;color:var(--muted);font-size:12px;padding:0}
.sbox.lbl.l{justify-content:flex-start;text-align:left}
.sbox.ttl{border:none;background:none;font-weight:700;font-size:13px;padding:0;justify-content:flex-start}
.sbox.zone{align-items:flex-start;justify-content:flex-start;font-size:12px;font-weight:600;color:var(--muted);padding:6px 9px;border-style:dashed}
.sbox.kern{background:var(--kern);border-color:var(--kern-line)}
.sbox.user{background:var(--user);border-color:var(--user-line)}
.sbox.hw{background:var(--hw)}
.sbox.hl{background:var(--hl-soft);border-color:var(--hl);box-shadow:0 0 0 3px color-mix(in srgb,var(--hl) 25%,transparent)}
.sbox.ok{background:var(--ok-soft);border-color:var(--ok)}
.sbox.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sbox.acc{background:var(--acc-soft);border-color:var(--acc)}
.sbox.dim{opacity:.45}
.sbox.tok{border-radius:99px;font-weight:700;font-size:12px;color:#fff;border:none;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.sbox.code{font-family:var(--f-mono);font-size:12px;justify-content:flex-start;text-align:left;white-space:pre}
.sbox.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sbox .s{font-size:11px;color:var(--muted);display:block}
.sl{fill:none;stroke-width:2;transition:opacity var(--dur)}
.sl-ink{stroke:var(--muted)} .sl-acc{stroke:var(--acc)} .sl-hl{stroke:var(--hl)} .sl-ok{stroke:var(--ok)} .sl-bad{stroke:var(--bad)} .sl-mut{stroke:var(--line)}
.sl.dash{stroke-dasharray:5 4}
.sl.thick{stroke-width:3.5}
.mk-ink{fill:var(--muted)} .mk-acc{fill:var(--acc)} .mk-hl{fill:var(--hl)} .mk-ok{fill:var(--ok)} .mk-bad{fill:var(--bad)} .mk-mut{fill:var(--line)}
/* tables, chips */
table.t{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:3px 8px;text-align:center}
table.t th{background:var(--panel2);font-weight:600}
table.t td.hl{background:var(--hl-soft);font-weight:700}
table.t td.ok{background:var(--ok-soft)} table.t td.bad{background:var(--bad-soft);color:var(--bad)}
table.t td.acc{background:var(--acc-soft)}
table.t input{width:46px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 2px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.chip.p{color:#fff;border:none}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.chip.hl{background:var(--hl-soft);color:var(--hl);border-color:var(--hl)}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.bad{color:var(--bad);font-weight:700} .ok{color:var(--ok);font-weight:700} .hlt{color:var(--hl);font-weight:700} .acct{color:var(--acc);font-weight:700} .mut{color:var(--muted)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:240px}
.lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.gantt text{font-size:11px;fill:var(--muted);font-family:var(--f-mono)}
.gantt .gl{fill:#fff;font-weight:700;font-size:12px;font-family:var(--f-body)}
.gantt rect.idle{fill:var(--panel2);stroke:var(--line)}
.gantt .now{stroke:var(--hl);stroke-width:2}
.gantt .axis{stroke:var(--line)}
.qbox{display:flex;gap:4px;align-items:center;min-height:30px;flex-wrap:wrap;padding:4px;border:1px dashed var(--line);border-radius:7px;background:var(--panel2)}
.qbox .chip{transition:all var(--dur)}
.quiz .qq{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:var(--panel)}
.quiz .qt{font-weight:600;margin:0 0 8px}
.quiz .qo{display:block;width:100%;text-align:left;margin:5px 0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer}
.quiz .qo:hover:not(:disabled){border-color:var(--acc)}
.quiz .qo.right{background:var(--ok-soft);border-color:var(--ok)}
.quiz .qo.wrong{background:var(--bad-soft);border-color:var(--bad)}
.quiz .qe{margin-top:8px;font-size:14px;background:var(--panel2);border-radius:7px;padding:8px 10px;display:none}
.quiz .qq.done .qe{display:block}
.qscore{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
/* CCS (concurrent code stepper) */
.ccs-procs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ccs-p{border:1.5px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;transition:border-color var(--dur),box-shadow var(--dur)}
.ccs-p.run{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.ccs-p.blk{border-color:var(--bad)}
.ccs-ph{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;font-weight:700;font-size:13px;color:#fff}
.ccs-code{position:relative;padding:4px 0;font-family:var(--f-mono);font-size:12px}
.ccs-l{padding:2px 10px 2px 22px;white-space:pre;position:relative}
.ccs-l.z-cs{background:color-mix(in srgb,var(--hl) 14%,transparent)}
.ccs-l.z-entry{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.ccs-l.cur{font-weight:700}
.ccs-pc{position:absolute;left:5px;width:12px;height:12px;color:var(--acc);font-size:12px;transition:top var(--dur);line-height:12px}
.ccs-shared{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.ccs-box{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);min-width:110px}
.ccs-box .v{font-family:var(--f-mono);font-size:20px;font-weight:700;transition:color var(--dur)}
.ccs-box.flash{animation:flash calc(var(--dur)*2)}
@keyframes flash{0%{background:var(--hl-soft)}100%{background:var(--panel)}}
.alert{padding:7px 11px;border-radius:7px;font-weight:600;font-size:13.5px;margin-top:8px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.ok{background:var(--ok-soft);color:var(--ok)} .alert.hl{background:var(--hl-soft);color:var(--hl)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.fs-f{white-space:pre-wrap;line-height:1.85;margin:10px 0;font-size:13.5px}
.fs-tw{overflow-x:auto;margin:10px 0}
.fs-t td,.fs-t th{vertical-align:top}
.fs-h{font-size:15px;margin:16px 0 4px}
.fs-p{margin:8px 0}
.fs-ul{margin:6px 0 10px;padding-left:20px}
.fs-see{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--acc);text-decoration:none}
.fs-see:hover{text-decoration:underline}
.formula{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;font-size:13px;overflow-x:auto}
.intro-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;font-size:13.5px}
.intro-box b{color:var(--acc)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 30% 0 0;z-index:20;transform:translateX(-105%);transition:transform .25s;height:100%;box-shadow:0 0 30px rgba(0,0,0,.3)}
  nav.side.open{transform:none}
  .mtop{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px}
  main{padding-top:14px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.sbox,.sl,.ccs-pc{transition:none!important}}
</style>

<body>
<div class="app">
<nav class="side" id="side">
  <div class="brand">OS<span>Lab</span></div>
  <div class="brand-sub">Operating systems through animation · based on SC2005 lectures</div>
  <div id="nav"></div>
  <div class="side-tools">
    <label for="gspeed">Default speed <select id="gspeed"></select></label>
    <label for="theme">Theme <select id="theme"><option value="">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <div style="margin-top:8px">Shortcuts (after clicking an animation frame): <kbd>Space</kbd> play/pause, <kbd>←</kbd><kbd>→</kbd> step, <kbd>Home</kbd> back to start.</div>
  </div>
</nav>
<div>
  <div class="mtop"><button class="btn" id="menuBtn" aria-label="Open chapter list">☰ Chapters</button><b id="mtitle"></b></div>
  <main id="main"></main>
</div>

<script>
// ================= PURE ALGORITHMS (no DOM) =================
'use strict';

// ---------- CPU scheduling (uni & multi-core, global) ----------
function schedSim(procs, opt) {
  const alg = opt.alg, q = opt.q || 4, cores = opt.cores || 1;
  const P = procs.map((p, i) => ({ ...p, i, rem: p.burst, first: null, fin: null }));
  const n = P.length; let t = 0; const ready = [];
  const run = Array(cores).fill(null), qleft = Array(cores).fill(0), open = Array(cores).fill(null);
  const segs = [], events = []; let done = 0, cs = 0;
  const pre = alg === 'SRTF' || alg === 'PRIO_P';
  const key = p => (alg === 'SJF' || alg === 'SRTF') ? [p.rem, p.arr, p.i] : (alg.startsWith('PRIO') ? [p.prio, p.arr, p.i] : [0]);
  const better = (a, b) => { const ka = key(a), kb = key(b); for (let j = 0; j < ka.length; j++) if (ka[j] !== kb[j]) return ka[j] < kb[j]; return false; };
  const bestIdx = () => { let bi = 0; if (alg === 'FCFS' || alg === 'RR') return 0; for (let j = 1; j < ready.length; j++) if (better(P[ready[j]], P[ready[bi]])) bi = j; return bi; };
  const kd = p => (alg === 'SJF' || alg === 'SRTF') ? `${p.rem} left` : alg.startsWith('PRIO') ? `priority ${p.prio}` : '';
  const closeSeg = c => { if (open[c]) { open[c].e = t; if (open[c].e > open[c].s) segs.push(open[c]); open[c] = null; } };
  while (done < n && t < 5000) {
    const log = [];
    for (let c = 0; c < cores; c++) { const pi = run[c]; if (pi != null && P[pi].rem === 0) { P[pi].fin = t; closeSeg(c); run[c] = null; done++; log.push(`<b>${P[pi].name}</b> finishes (Terminated)`); } }
    for (const p of P) if (p.arr === t) { ready.push(p.i); log.push(`<b>${p.name}</b> arrives in the Ready queue (burst ${p.burst}${alg.startsWith('PRIO') ? ', priority ' + p.prio : ''})`); }
    if (alg === 'RR') for (let c = 0; c < cores; c++) { const pi = run[c]; if (pi != null && qleft[c] === 0) { closeSeg(c); if (ready.length) { ready.push(pi); run[c] = null; log.push(`<b>${P[pi].name}</b> used up its quantum q=${q} → moved to the <i>tail</i> of the Ready queue (${P[pi].rem} left)`); } else { qleft[c] = q; log.push(`<b>${P[pi].name}</b> used up its quantum but the queue is empty → runs another quantum`); } } }
    if (done === n) break;
    for (let c = 0; c < cores; c++) if (run[c] == null && ready.length) { const pi = ready.splice(bestIdx(), 1)[0]; run[c] = pi; qleft[c] = q; if (P[pi].first == null) P[pi].first = t; cs++; log.push(`Scheduler picks <b>${P[pi].name}</b>${kd(P[pi]) ? ' (' + kd(P[pi]) + ')' : ''} → runs on core ${c + 1}`); }
    if (pre) while (ready.length && !run.some(x => x == null)) {
      const bi = bestIdx(); let wc = 0; for (let c = 1; c < cores; c++) if (better(P[run[wc]], P[run[c]])) wc = c;
      if (!better(P[ready[bi]], P[run[wc]])) break;

  function toggle() { if (P.playing) { stop(); return; } PLAYERS.forEach(o => o !== P && o.stop()); if (P.i >= P.steps.length - 1) go(0); P.playing = true; bPl.textContent = '❚❚'; sched(); }
  root.addEventListener('keydown', e => {
    if (e.target !== root) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); } else if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(P.i + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(P.i - 1); } else if (e.key === 'Home') { stop(); go(0); } else if (e.key === 'End') { stop(); go(P.steps.length - 1); }
  });
  P.stop = stop; P.go = go; P.show = show; P.play = () => { if (!P.playing) toggle(); };
  P.setSteps = (st, keep) => { stop(); P.steps = st.length ? st : [{ msg: '' }]; P.i = keep ? Math.min(P.i, P.steps.length - 1) : 0; show(); };
  P.rebuild = () => { if (cfg.build) P.setSteps(cfg.build(P)); };
  P.push = s => { stop(); P.steps = P.steps.slice(0, P.i + 1); P.steps.push(s); P.i++; show(); };
  P.cur = () => P.steps[P.i];
  P.setSpeed = s => { P.speed = s; spd.value = s; setDur(); };
  PLAYERS.add(P);
  if (cfg.setup) cfg.setup(P);
  if (cfg.build) P.rebuild(); else show();
  return P;
}

// ---------- Gantt chart (SVG string) ----------
function ganttSVG(o) {
  // o: rows:[label], segs:[{r,s,e,c(colorIdx),t,cls}], T, now, marks:[{x,r,kind}], W
  const W = o.W || 860, L = Math.max(64, 8 + 7.2 * Math.max(...o.rows.map(r => String(r).length))), rowH = 30, gap = 8, top = 6, T = Math.max(1, o.T);
  const sx = x => L + (W - L - 12) * x / T; const H = top + o.rows.length * (rowH + gap) + 26;
  let s = `<svg class="gantt" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:520px">`;
  o.rows.forEach((r, i) => { const y = top + i * (rowH + gap); s += `<text x="4" y="${y + 19}" style="font-weight:600;fill:var(--ink)">${r}</text><rect class="idle" x="${L}" y="${y}" width="${W - L - 12}" height="${rowH}" rx="4"/>`; });
  const ticks = new Set([0]);
  for (const g of o.segs) {
    if (o.now != null && g.s >= o.now) continue;
    const e = o.now != null ? Math.min(g.e, o.now) : g.e; const y = top + g.r * (rowH + gap);
    const x1 = sx(g.s), x2 = sx(e);
    s += `<rect x="${x1}" y="${y}" width="${Math.max(0, x2 - x1)}" height="${rowH}" fill="${g.col || pcol(g.c)}" stroke="var(--panel)" stroke-width="1.5" rx="3" ${g.cls ? `class="${g.cls}"` : ''}/>`;
    if (x2 - x1 > 18 && g.t) s += `<text class="gl" x="${(x1 + x2) / 2}" y="${y + 19}" text-anchor="middle">${g.t}</text>`;
    ticks.add(g.s); ticks.add(e);
  }
  (o.extraTicks || []).forEach(x => ticks.add(x));
  if (o.now == null) ticks.add(T);
  const yb = top + o.rows.length * (rowH + gap);
  let lastX = -99;
  [...ticks].sort((a, b) => a - b).forEach(t => { const x = sx(t); if (x - lastX < 16) return; lastX = x; s += `<line class="axis" x1="${x}" y1="${top}" x2="${x}" y2="${yb - 2}" stroke-dasharray="2 3"/><text x="${x}" y="${yb + 14}" text-anchor="middle">${t}</text>`; });
  (o.marks || []).forEach(m => {
    const x = sx(m.x), y = top + m.r * (rowH + gap);
    if (m.kind === 'rel') s += `<path d="M${x},${y + rowH + 3} L${x},${y - 4} M${x - 4},${y + 2} L${x},${y - 4} L${x + 4},${y + 2}" stroke="${m.col || 'var(--ok)'}" stroke-width="2" fill="none"/>`;
    if (m.kind === 'dl') s += `<path d="M${x},${y - 4} L${x},${y + rowH + 3} M${x - 4},${y + rowH - 3} L${x},${y + rowH + 3} L${x + 4},${y + rowH - 3}" stroke="${m.col || 'var(--muted)'}" stroke-width="2" fill="none"/>`;
    if (m.kind === 'miss') s += `<circle cx="${x}" cy="${y + rowH / 2}" r="8" fill="var(--bad)"/><text x="${x}" y="${y + rowH / 2 + 4}" text-anchor="middle" style="fill:#fff;font-weight:700">!</text>`;
  });
  if (o.now != null) { const x = sx(o.now); s += `<line class="now" x1="${x}" y1="${top - 4}" x2="${x}" y2="${yb}"/><text x="${x}" y="${yb + 24}" text-anchor="middle" style="fill:var(--hl);font-weight:700">t=${o.now}</text>`; }
  return s + '</svg>';
}

// ---------- Simple bar/line chart (SVG string) ----------
function barChart(o) {
  // o: labels, series:[{name,vals,col}], W,H, hi (index), yLabel
  const W = o.W || 520, H = o.H || 220, L = 40, B = 34, T = 14, R = 10;
  const max = Math.max(1, ...o.series.flatMap(s => s.vals)) * 1.12;
  const n = o.labels.length, gw = (W - L - R) / n, bw = Math.min(26, (gw - 8) / o.series.length);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" class="gantt">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = H - B - (H - B - T) * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${k ? '2 3' : ''}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${Math.round(v * 10) / 10}</text>`; }
  o.labels.forEach((lb, i) => {
    const gx = L + gw * i + (gw - bw * o.series.length) / 2;
    if (o.hi === i) s += `<rect x="${L + gw * i + 1}" y="${T - 4}" width="${gw - 2}" height="${H - B - T + 4}" fill="var(--hl-soft)" rx="4"/>`;
    o.series.forEach((se, j) => { const v = se.vals[i], bh = (H - B - T) * v / max, x = gx + j * bw; s += `<rect x="${x}" y="${H - B - bh}" width="${bw - 2}" height="${bh}" fill="${se.col}" rx="2"/>`; if (o.showV) s += `<text x="${x + bw / 2 - 1}" y="${H - B - bh - 3}" text-anchor="middle" style="fill:var(--ink)">${v}</text>`; });
    s += `<text x="${L + gw * i + gw / 2}" y="${H - B + 15}" text-anchor="middle" style="${o.hi === i ? 'fill:var(--hl);font-weight:700' : ''}">${lb}</text>`;
  });
  if (o.xLabel) s += `<text x="${(W + L) / 2}" y="${H - 3}" text-anchor="middle">${o.xLabel}</text>`;
  return s + '</svg>';
}

// ---------- Concurrent Code Stepper (for synchronization chapters) ----------
// conf: { procs:[{name, code:[{t, z:'entry'|'cs'|'exit'|'rem', spin?(st,me), run?(st,me) -> undefined|'block'|{goto}, say?(st,me,res)}]}],
//         init()->{vars:{}, sem:{name:{v, L:[]}}}, maxCS, presets:[{name, seq}], showVars:[...], extra?(st, el, conf), stayRem?:bool }
function semW(name) { return { t: `Wait(${name});`, run: (st, me) => { const s = st.sem[name]; s.v--; if (s.v < 0) { s.L.push(me); return 'block'; } }, say: (st, me, r) => r === 'block' ? `${name}.value drops to ${st.sem[name].v} &lt; 0 → <b>block()</b>: the process's PCB moves from the CPU into queue ${name}.L, state → Waiting.` : `${name}.value drops to ${st.sem[name].v} ≥ 0 → continue.` }; }
function semS(name) { return { t: `Signal(${name});`, run: (st) => { const s = st.sem[name]; s.v++; if (s.v <= 0) { const p = s.L.shift(); st.P[p].blocked = false; st.woke = p; } }, say: (st, me) => st.woke != null ? `${name}.value rises to ${st.sem[name].v} ≤ 0 → someone is waiting → <b>wakeup()</b> moves the head of queue L to Ready.` : `${name}.value rises to ${st.sem[name].v}; nobody is waiting.` }; }

function CCS(host, conf) {
  const n = conf.procs.length;
  const mkState = () => { const s = conf.init(); s.P = conf.procs.map(() => ({ pc: 0, blocked: false, spins: 0, cs: 0 })); s.cur = null; s.cs = 0; s.viol = false; s.dead = false; s.stuckRem = Array(n).fill(false); s.log = []; return s; };
  let cards = [];
  const stepState = (st0, i) => {
    const st = clone(st0); st.woke = null; const P = st.P[i], code = conf.procs[i].code;
    if (P.blocked || code[P.pc].end) return null;
    let msg = '';
    if (st.cur !== i && st.cur !== null) { st.cs++; msg += `<span class="why-chip">context switch</span>${conf.procs[st.cur].name} → ${conf.procs[i].name}. `; }
    st.cur = i;
    const ln = code[P.pc];
    if (ln.z === 'rem' && st.stuckRem[i]) { msg += `${conf.procs[i].name} stays in its remainder section (busy with something else for a long time).`; }
    else if (ln.spin && ln.spin(st, i)) { P.spins++; msg += `${conf.procs[i].name}: <code>${ln.t.trim()}</code> → condition still true → <b>spins (busy wait)</b>, wasting CPU.`; }
    else {
      const r = ln.run ? ln.run(st, i) : undefined;
      msg += `${conf.procs[i].name} executes <code>${ln.t.trim()}</code>` + (ln.say ? ' → ' + ln.say(st, i, r) : (ln.spin ? ' → condition false → leaves the loop.' : ''));
      if (r === 'block') P.blocked = true;
      if (r && r.goto != null) P.pc = r.goto; else P.pc = (P.pc + 1) % code.length;
      if (code[P.pc].z === 'cs') P.cs++;
    }
    const csl = range(n).filter(k => !st.P[k].blocked && conf.procs[k].code[st.P[k].pc].z === 'cs'); const inCS = csl.length;
    if (conf.viol ? conf.viol(csl, st) : inCS > (conf.maxCS || 1)) { st.viol = true; msg += ` <span class="bad">⚠ MUTUAL EXCLUSION VIOLATED: ${csl.map(k => conf.procs[k].name).join(' and ')} are in the critical section together!</span>`; }
    const live = range(n).filter(k => !st.P[k].blocked && !conf.procs[k].code[st.P[k].pc].end);
    const canMove = live.some(k => { const l = conf.procs[k].code[st.P[k].pc]; if (l.z === 'rem' && st.stuckRem[k]) return false; return !(l.spin && l.spin(st, k)); });
    const someoneRem = live.some(k => st.stuckRem[k]);
    if (!canMove && !someoneRem && (live.length || st.P.some(p => p.blocked))) { st.dead = true; msg += live.length ? ` <span class="bad">⚠ DEADLOCK/LIVELOCK: every process is waiting for a condition that never changes.</span>` : ` <span class="bad">⚠ DEADLOCK: every process is blocked in a semaphore queue.</span>`; }
    else st.dead = false;
    st.msg = msg; return st;
  };
  const P = Player(host, {
    base: 1300,
    setup(Pl) {
      const procs = h('div', { class: 'ccs-procs' }); const shared = h('div', { class: 'ccs-shared' });
      const extra = h('div'); const alerts = h('div');
      Pl.viz.append(procs, shared, extra, alerts); Pl._el = { procs, shared, extra, alerts };
      cards = conf.procs.map((pr, i) => {
        const pc = h('div', { class: 'ccs-pc' }, '➤');
        const lines = pr.code.map(l => h('div', { class: 'ccs-l z-' + (l.z || '') }, l.t));
        const st = h('span', { class: 'chip' });
        const card = h('div', { class: 'ccs-p' }, h('div', { class: 'ccs-ph', style: `background:${pcol(conf.colorOff ? i + conf.colorOff : i)}` }, pr.name, st), h('div', { class: 'ccs-code' }, pc, lines));
        procs.append(card); return { card, pc, lines, st };
      });
      // action buttons
      conf.procs.forEach((pr, i) => { const b = btn('▶ Run 1 instruction of ' + pr.name, () => { const s = stepState(Pl.cur(), i); if (s) Pl.push(s); }); b.style.borderColor = pcol(conf.colorOff ? i + conf.colorOff : i); Pl.act.append(b); cards[i].btn = b; });
      Pl.act.append(btn('🎲 Random ×1', () => rnd(1)), btn('🎲 ×10', () => rnd(10)));
      if (conf.stayRem) conf.procs.forEach((pr, i) => { const c = fChk(` ${pr.name} stuck in remainder forever`, false, v => { const s = clone(Pl.cur()); s.stuckRem[i] = v; s.msg = v ? `${pr.name} will stay in its remainder section for a long time (e.g. waiting for I/O).` : `${pr.name} may leave its remainder section.`; Pl.push(s); }); c.style.fontSize = '12.5px'; Pl.act.append(c); cards[i].stay = c.querySelector('input'); });
      function rnd(k) { let s = Pl.cur(); const seq = [];
        for (let j = 0; j < k; j++) { const cand = range(n).filter(x => !s.P[x].blocked && !conf.procs[x].code[s.P[x].pc].end && !(conf.procs[x].code[s.P[x].pc].z === 'rem' && s.stuckRem[x])); if (!cand.length) break; const i = cand[Math.floor(Math.random() * cand.length)]; const ns = stepState(s, i); if (!ns) break; seq.push(ns); s = ns; if (ns.viol || ns.dead) break; }
        seq.forEach(x => Pl.push(x)); }
      if (conf.presets) Pl.top.append(fSel('Scenario:', [['', '— choose step by step —'], ...conf.presets.map((p, k) => [k, p.name])], '', v => {
        if (v === '') { Pl.setSteps([{ ...mkState(), msg: 'Initial state. Press each process\'s “Run 1 instruction” button to decide the interleaving yourself.' }]); return; }
        const pr = conf.presets[+v]; let s = mkState(); (pr.stay || []).forEach(k => s.stuckRem[k] = true); s.msg = pr.intro || 'Initial state.'; const st = [s];
        for (const i of pr.seq) { const ns = stepState(s, i); if (!ns) continue; st.push(ns); s = ns; }
        if (pr.outro) st[st.length - 1] = { ...st[st.length - 1], msg: st[st.length - 1].msg + '<br>' + pr.outro, hold: 2 };
        Pl.setSteps(st);
      }));
      Pl.top.append(btn('↺ Reset', () => Pl.setSteps([{ ...mkState(), msg: 'Reset.' }])));
    },
    build() { const s = mkState(); s.msg = conf.intro || 'Initial state. Press each process\'s “Run 1 instruction” button to build your own interleaving, or pick a preset scenario and press ▶.'; return [s]; },
    render(st, Pl) {
      conf.procs.forEach((pr, i) => {
        const c = cards[i], p = st.P[i], ln = pr.code[p.pc];
        c.lines.forEach((l, k) => l.classList.toggle('cur', k === p.pc));
        c.pc.style.top = (c.lines[p.pc].offsetTop + 4) + 'px';
        let label = 'Ready', cls = '';
        if (p.blocked) { label = 'Blocked'; cls = 'bad'; } else if (st.cur === i) { label = 'Running'; cls = 'acc'; }
        if (!p.blocked && ln.z === 'cs') { label += ' · trong CS'; cls = 'hl'; }
        if (!p.blocked && ln.spin && ln.spin(st, i)) label += ' · spin';
        c.st.className = 'chip ' + cls; c.st.textContent = label;
        c.card.classList.toggle('run', st.cur === i && !p.blocked); c.card.classList.toggle('blk', p.blocked);
        if (ln.end) { label = 'Done'; cls = 'ok'; }
        if (c.btn) c.btn.disabled = p.blocked || !!ln.end; if (c.stay) c.stay.checked = st.stuckRem[i];
      });
      const prev = Pl.steps[Pl.i - 1];
      const box = (k, v, sub, changed) => `<div class="ccs-box ${changed ? 'flash' : ''}"><div class="lab">${k}</div><div class="v">${v}</div>${sub ? `<div class="mut" style="font-size:12px">${sub}</div>` : ''}</div>`;
      let sh = '';
      for (const k of (conf.showVars || Object.keys(st.vars || {}))) { const v = st.vars[k]; sh += box(k, Array.isArray(v) ? '[' + v.map(x => String(x)).join(', ') + ']' : String(v), '', prev && JSON.stringify(prev.vars[k]) !== JSON.stringify(v)); }
      for (const k in (st.sem || {})) { const s = st.sem[k]; const ch = prev && (prev.sem[k].v !== s.v || prev.sem[k].L.length !== s.L.length);
        sh += box('semaphore ' + k, s.v, 'L: ' + (s.L.length ? s.L.map(x => pchip(conf.procs[x].name, conf.colorOff ? x + conf.colorOff : x)).join(' ') : '<i>empty</i>'), ch); }
      sh += box('Context switch', st.cs, 'CPU: ' + (st.cur == null ? '—' : conf.procs[st.cur].name), false);
      Pl._el.shared.innerHTML = sh;
      if (conf.extra) conf.extra(st, Pl._el.extra, conf);
      Pl._el.alerts.innerHTML = (st.viol ? '<div class="alert bad">Mutual exclusion was violated in this run.</div>' : '') + (st.dead ? '<div class="alert bad">The system is stuck: no process can make progress.</div>' : '');
    }
  });
  return P;
}

chapter({

  lead: 'A process is a program in execution: its code plus all execution state (PC, registers, stack, heap, open files). The OS manages each process through a PCB and moves it between queues. A thread is a smaller unit of CPU use; threads of the same process share code, data and files.',
  sections: [
    {
      t: 'A process in memory: text, data, heap, stack',
      why: [['Problem', 'A program needs room for code, global variables, a dynamically allocated area (size unknown in advance) and nested function calls.'], ['Idea', 'Split the process image into 4 regions by <b>data lifetime</b>. Text and data are fixed at load time. The heap grows on <code>new</code>. The stack grows and shrinks with function calls. Heap and stack grow <b>towards each other</b>, so the gap between them can serve either.']],
      mount(el) {
        let S;
        const code = ['int g = 7;', 'int main() {', '  int x = 3;', '  int *a = new int[10];', '  f(x);', '}', 'void f(int p) {', '  int y = p * 2;', '}'];
        const steps = [
          { ln: 1, data: true, frames: [], heap: false, msg: 'The loader builds the <b>process image</b>: machine code into <b>text</b>, global variable <code>g</code> into <b>data</b>. The PC points at <code>main</code>.' },
          { ln: 2, data: true, frames: [['main', 'x = 3']], heap: false, msg: 'Calling <code>main</code> → pushes a <b>stack frame</b>. Local variable <code>x</code> lives in the frame.' },
          { ln: 3, data: true, frames: [['main', 'x = 3', 'a = ●']], heap: true, msg: '<code>new int[10]</code> allocates 40 bytes on the <b>heap</b> (dynamic, lives until delete). Pointer <code>a</code> is a local variable, so it sits on the stack and points into the heap.' },
          { ln: 4, data: true, frames: [['main', 'x = 3', 'a = ●'], ['f', 'p = 3 (parameter)', 'return address']], heap: true, msg: 'Calling <code>f(x)</code> → pushes a new frame holding <b>parameter</b> <code>p</code> and the return address. The stack grows towards the heap.' },
          { ln: 7, data: true, frames: [['main', 'x = 3', 'a = ●'], ['f', 'p = 3 (parameter)', 'return address', 'y = 6']], heap: true, msg: '<code>y</code> is a local variable of f → lives in f\'s frame.' },
          { ln: 8, data: true, frames: [['main', 'x = 3', 'a = ●']], heap: true, msg: 'f returns → its frame is <b>popped</b>; <code>p</code> and <code>y</code> vanish. The heap array survives because it is not tied to a function call.' },
          { ln: 5, data: true, frames: [['main', 'x = 3', 'a = ●']], heap: true, msg: 'The whole range [Base, Base+Limit) belongs to the process. The base and limit registers (saved in the PCB) let the hardware block accesses outside it.' }

            S.box('heap', { x: X, y: 108, w: W, h: s.heap ? 54 : 26, cls: s.heap && s.ln === 3 ? 'hl' : 'zone', html: s.heap ? '<b>heap</b> · int[10] (40 B) ↓ grows down' : 'heap (empty)' });
            S.box('gap', { x: X + 70, y: 180, w: 110, h: 20, cls: 'lbl', html: '⇅ free gap' });

            S.box('stk', { x: X - 110, y: 300, w: 100, h: 30, cls: 'lbl', html: '<b>stack</b> ↑ grows up' });
            if (s.heap && s.frames.length) { const mf = s.frames[0]; const hh = 22 + mf.length * 18; S.line('ptr', { pts: [[X + W - 6, 350 - hh + 40], [X + W + 40, 300], [X + W + 40, 135], [X + W, 135]], c: 'acc', arrow: true }); }

      }
    },
    {
      t: 'Process state diagram (trigger the events yourself)',
      why: [['Problem', 'There are dozens of processes but only one CPU (one core). The OS must know who is running, who is ready and who is waiting for what.'], ['Idea', 'Every process is in <b>exactly one of 5 states</b>: New, Ready, Running, Waiting, Terminated. Each arrow corresponds to a specific event. In a multiprogrammed system, the <b>timer interrupt</b> forces the running process back to Ready so others get to run.']],
      exam: 'There is no Waiting → Running arrow and no Ready → Waiting arrow. To wait for I/O a process must be running (it has to execute the I/O request). When the I/O completes it goes back to Ready, not straight to running.',
      mount(el) {
        let S;
        const SP = { none: [20, 300], new: [30, 40], ready: [250, 150], running: [560, 150], waiting: [400, 270], term: [770, 40] };
        const names = ['P1', 'P2', 'P3', 'P4'];
        const init = () => ({ st: names.map(() => 'none'), ready: [], wait: [], run: null, edge: null, msg: 'No processes yet. Use the event buttons below or press ▶ to watch a sample scenario.' });
        const A = {
          create: s => { const i = s.st.indexOf('none'); if (i < 0) return null; s.st[i] = 'new'; s.edge = null; s.msg = `<b>${names[i]}</b> is created (New): the OS allocates a PCB and loads the program.`; return s; },
          admit: s => { const i = s.st.indexOf('new'); if (i < 0) return null; s.st[i] = 'ready'; s.ready.push(i); s.edge = 'admit'; s.msg = `<b>admitted</b>: ${names[i]} enters the Ready queue.${s.run == null ? ' The CPU is free → the scheduler will pick right away.' : ''}`; return s; },
          dispatch: s => { if (s.run != null || !s.ready.length) return null; const i = s.ready.shift(); s.st[i] = 'running'; s.run = i; s.edge = 'dispatch'; s.msg = `<b>scheduler dispatch</b>: the short-term scheduler picks ${names[i]} (head of queue) → loads its context from the PCB → Running.`; return s; },
          timer: s => { if (s.run == null) return null; const i = s.run; s.st[i] = 'ready'; s.ready.push(i); s.run = null; s.edge = 'int'; s.msg = `<b>timer interrupt</b>: ${names[i]} used up its time slice → moved to the <i>tail</i> of Ready. (Preemptive: the CPU is taken back.)`; return s; },
          io: s => { if (s.run == null) return null; const i = s.run; s.st[i] = 'waiting'; s.wait.push(i); s.run = null; s.edge = 'io'; s.msg = `<b>I/O or event wait</b>: ${names[i]} gives up the CPU and joins a device queue. CPU free → scheduling is <b>mandatory</b>.`; return s; },
          iodone: s => { if (!s.wait.length) return null; const i = s.wait.shift(); s.st[i] = 'ready'; s.ready.push(i); s.edge = 'iodone'; s.msg = `<b>I/O completion</b>: a device interrupt → ${names[i]} goes back to Ready (it does not run immediately).`; return s; },
          exit: s => { if (s.run == null) return null; const i = s.run; s.st[i] = 'term'; s.run = null; s.edge = 'exit'; s.msg = `<b>exit</b>: ${names[i]} terminates; the OS reclaims its resources. CPU free → scheduling is <b>mandatory</b>.`; return s; }
        };
        const LBL = { create: '+ Create process', admit: 'Admit', dispatch: 'Dispatch', timer: 'Timer interrupt', io: 'Request I/O', iodone: 'I/O completes', exit: 'Exit' };

        const btns = {};

          setup(P) { S = new Stage(P.viz, 900, 340); for (const k in A) { btns[k] = btn(LBL[k], () => { const s = A[k](clone(P.cur())); if (s) P.push(s); }); P.act.append(btns[k]); } P.act.append(btn('↺ Reset', () => P.setSteps([init()]))); },
          build() { let s = init(); const st = [s]; for (const a of demo) { const n = A[a](clone(s)); if (n) { st.push(n); s = n; } } return st; },
          after(P) { const s = P.cur(); for (const k in A) btns[k].disabled = !A[k](clone(s)); },
          render(s) {
            S.begin();
            const node = (k, t, x, y, w) => S.box('n' + k, { x, y, w, h: 70, cls: 'zone ' + (k === 'running' && s.run != null ? 'acc' : ''), html: t });
            node('new', 'NEW', 20, 20, 150); node('ready', 'READY', 230, 130, 230); node('running', 'RUNNING (CPU)', 540, 130, 150); node('waiting', 'WAITING', 380, 250, 230); node('term', 'TERMINATED', 740, 20, 150);
            const E = [['admit', [170, 55], [240, 130], 'admitted'], ['dispatch', [460, 150], [540, 150], 'scheduler dispatch'], ['int', [540, 190], [460, 190], 'interrupt'], ['io', [615, 200], [560, 250], 'I/O or event wait'], ['iodone', [400, 250], [360, 200], 'I/O completion'], ['exit', [690, 140], [760, 90], 'exit']];
            E.forEach(([k, a, b, t]) => { S.line('e' + k, { pts: [a, b], c: s.edge === k ? 'hl' : 'ink', arrow: true, thick: s.edge === k }); S.box('el' + k, { x: (a[0] + b[0]) / 2 - 60, y: (a[1] + b[1]) / 2 + (k === 'int' ? 4 : k === 'dispatch' ? -20 : -8), w: 120, h: 16, cls: 'lbl', fg: s.edge === k ? 'var(--hl)' : '', html: t }); });
            names.forEach((n, i) => {
              const st = s.st[i]; let x, y;
              if (st === 'ready') { x = 240 + s.ready.indexOf(i) * 52; y = 160; } else if (st === 'waiting') { x = 390 + s.wait.indexOf(i) * 52; y = 280; }
              else if (st === 'running') { x = 590; y = 160; } else { const k = names.filter((_, j) => j < i && s.st[j] === st).length; const b = SP[st]; x = b[0] + 10 + k * 48; y = b[1] + 10 + (st === 'none' ? 0 : 0); if (st === 'none') { x = 20 + i * 48; y = 300; } }
              S.box('p' + i, { x, y, w: 44, h: 28, cls: 'tok', bg: pcol(i), op: st === 'none' ? 0.25 : st === 'term' ? 0.5 : 1, html: n, z: 4 });
            });
            S.box('rq', { x: 650, y: 280, w: 240, h: 50, cls: 'lbl l', html: `Ready queue: ${s.ready.map(i => names[i]).join(' → ') || '∅'}<br>Device queue: ${s.wait.map(i => names[i]).join(' → ') || '∅'}` });
            S.end();
          }
        });
      }
    },
    {
      t: 'Context switch: saving and reloading the PCB',
      why: [['Problem', 'To pause P0 and later resume it at exactly the right spot, everything in the CPU must be remembered: PC, registers, stack pointer.'], ['Idea', 'Each process has a <b>PCB</b> in kernel memory (state, pid, PC, registers, priority, base/limit, open-file list…). A context switch copies the CPU state into the old PCB, then loads from the new PCB. During that time the system does <b>no useful work</b>: it is pure overhead.']],
      mount(el) {
        let S;
        const C0 = { PC: '0x40A', R1: '12', SP: '0x7F0' }, C1 = { PC: '0x81C', R1: '99', SP: '0x6E0' };
        const st = [];

        let s = { cpu: { ...C0 }, pcb0: { state: 'Running', PC: '?', R1: '?', SP: '?' }, pcb1: { state: 'Ready', ...C1 }, mode: 'user · P0', tl: [['P0', 4]], fly: null };
        push(s, 'P0 is running. The values in the CPU are P0\'s <b>context</b>. PCB1 holds the saved context of P1 (Ready).');
        s.mode = 'kernel · OS'; s.tl.push(['OS', 1]); push(s, '<b>Timer interrupt</b> → the CPU enters the kernel. From here until P1 runs is <b>overhead</b> (grey on the timeline).');
        s.pcb0.PC = C0.PC; s.fly = ['PC', 0]; s.tl[1][1] = 2; push(s, 'Save P0\'s PC into PCB0.');
        s.pcb0.R1 = C0.R1; s.pcb0.SP = C0.SP; s.fly = ['R1', 0]; s.tl[1][1] = 3; push(s, 'Save the registers (R1, SP…) into PCB0. Set PCB0.state = Ready and put it in the ready queue.');
        s.pcb0.state = 'Ready'; s.fly = null; s.tl[1][1] = 4; push(s, 'The short-term scheduler picks P1 from the ready queue.');

        s.pcb1.state = 'Running'; s.mode = 'user · P1'; s.fly = null; s.tl.push(['P1', 4]); push(s, 'Back to user mode: P1 resumes <b>at instruction 0x81C</b> as if it had never stopped.');
        s.tl.push(['OS', 5]); s.tl.push(['P0', 3]); s.cpu = { ...C0 }; s.pcb1 = { state: 'Ready', ...C1 }; s.pcb0.state = 'Running'; s.mode = 'user · P0'; push(s, 'The next interrupt does the reverse: save P1, load P0. The more often context switches happen (e.g. a too-small RR quantum), the more time is wasted.');
        Player(el, {

            });
            if (s.fly) S.line('fly', { pts: s.fly[1] === 0 ? [[340, 100], [200, 150]] : [[700, 150], [540, 100]], c: 'hl', arrow: true, thick: true });
            let x = 10; S.box('tlL', { x: 10, y: 252, w: 300, h: 16, cls: 'lbl l', html: 'Timeline (grey = OS overhead)' });
            s.tl.forEach(([who, w], i) => { const ww = w * 38; S.box('tl' + i, { x, y: 272, w: ww, h: 40, cls: who === 'OS' ? 'hw' : 'tok sq', bg: who === 'P0' ? pcol(0) : who === 'P1' ? pcol(1) : '', html: who === 'OS' ? 'save/load' : who + ' running' }); x += ww + 2; });

    {
      t: 'Queues & the three schedulers',
      why: [['Problem', 'Three decisions at very different frequencies: which job to bring from disk into memory, who gets the CPU <i>right now</i>, and whom to push out to disk when overloaded.'], ['Idea', '<b>Long-term</b> (seconds/minutes): sets the initial degree of multiprogramming. <b>Short-term</b> (~100 ms): picks from the ready queue and must be very fast. <b>Medium-term</b>: swaps partially executed processes out/in to adjust the load. The queues are lists of PCBs in kernel memory.']],
      mount(el) {
        let S; const N = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6'];
        const st = []; let L = { pool: [0, 1, 2, 3, 4, 5], ready: [], cpu: [], disk: [], term: [], swap: [] }, hl = '';
        const push = (msg) => st.push({ L: clone(L), hl, msg });

        L.pool = [4, 5]; L.ready = [0, 1, 2, 3]; hl = 'long'; push('The <b>long-term scheduler</b> (runs rarely, every few seconds/minutes) loads P1–P4 into memory → ready queue. Degree of multiprogramming = 4.');
        L.ready = [1, 2, 3]; L.cpu = [0]; hl = 'short'; push('The <b>short-term scheduler</b> picks P1 for the CPU. It runs very often, so it must be extremely fast.');
        L.cpu = [1]; L.ready = [2, 3]; L.disk = [0]; hl = 'short'; push('P1 requests a disk read → PCB P1 moves to the <b>disk device queue</b>. Short-term picks P2.');
        L.cpu = [2]; L.ready = [3, 1]; hl = 'short'; push('Timer interrupt: P2 goes to the tail of the ready queue. Pick P3.');
        L.cpu = [3]; L.ready = [1]; L.term = [2]; hl = 'short'; push('P3 waits for the keyboard → <b>terminal queue</b>. Pick P4.');
        L.ready = []; L.swap = [1]; hl = 'med'; push('Memory is overloaded → the <b>medium-term scheduler</b> swaps out P2 (partially executed) to the swap area on disk. Degree of multiprogramming drops to 3.');
        L.disk = []; L.ready = [0]; hl = ''; push('Disk done → P1 moves from the device queue back to the ready queue.');

            S.line('lt', { pts: [[180, 80], [250, 90]], c: s.hl === 'long' ? 'hl' : 'ink', arrow: true, thick: s.hl === 'long' }); S.box('ltL', { x: 172, y: 96, w: 80, h: 30, cls: 'lbl', html: 'long-term' });

            S.line('mt', { pts: [[250, 110], [180, 230]], c: s.hl === 'med' ? 'hl' : 'ink', arrow: 'both', dash: true }); S.box('mtL', { x: 175, y: 150, w: 80, h: 30, cls: 'lbl', html: 'medium-term' });
            const pos = { pool: (k) => [20 + (k % 3) * 50, 60 + Math.floor(k / 3) * 36], swap: k => [20 + k * 50, 222], ready: k => [258 + k * 54, 76], cpu: () => [755, 76], disk: k => [258 + k * 54, 176], term: k => [258 + k * 54, 261] };

    {
      t: 'Process creation: fork(), the process tree and wait()',
      why: [['Problem', 'Shells, browsers with many tabs and background services all need to spawn new processes that run concurrently.'], ['Idea', 'A parent creates a child with <code>fork()</code> → forming a <b>process tree</b>. The parent can run <b>concurrently</b> with the child, or <b>wait</b> for it with <code>wait()/join()</code>. Termination: <b>exit</b> (the child asks to be deleted and may return data to its parent) or <b>abort</b> (the parent kills the child when it exceeds its resources, its task is no longer needed, or the parent is exiting).']],
      mount(el) {
        let S;
        const nodes = { root: [380, 10, 'Root process'], c1: [140, 90, 'Console 1'], c2: [380, 90, 'Console 2'], bg: [640, 90, 'Background'], sw: [570, 170, 'swap'], fl: [720, 170, 'flush'], uz: [140, 170, 'Unzip'], se: [380, 170, 'Search'] };
        const par = { c1: 'root', c2: 'root', bg: 'root', sw: 'bg', fl: 'bg', uz: 'c1', se: 'c2' };
        const order = ['root', 'c1', 'c2', 'bg', 'sw', 'fl', 'uz', 'se'];
        const steps = [];
        order.forEach((k, i) => steps.push({ n: order.slice(0, i + 1), code: null, msg: i === 0 ? 'Boot: the root process.' : `<b>${nodes[par[k]][2]}</b> calls fork() → spawns <b>${nodes[k][2]}</b>.` }));
        const base = order;
        steps.push({ n: base, code: 0, msg: 'Zoom in on Console 1 creating Unzip. Console 1 runs <code>pid = fork();</code>' });

        steps.push({ n: base, code: 3, msg: 'The child finishes and calls <code>exit(0)</code>: the exit code goes to the parent and the OS reclaims the child\'s resources.' });

        Player(el, {

function switcher(el, label, opts, make) {
  const box = h('div'); let cur = opts[0][0];
  const sel = fSel(label, opts, cur, v => { cur = v; box.innerHTML = ''; make(box, v); });
  sel.style.marginBottom = '8px'; sel.style.display = 'flex';
  el.append(sel, box); make(box, cur);
}
chapter({
  t: 'Process Synchronization', short: 'Synchronization',
  lead: 'The hardest part of the course. Every animation here executes <b>one instruction at a time</b>. You choose which process runs the next instruction (i.e. you decide where context switches happen), or pick a preset scenario, and the system detects mutual-exclusion violations and deadlocks by itself.',
  sections: [
    {
      t: 'Race condition: counter++ and counter-- lose an update',
      why: [['Problem', '<code>counter++</code> looks like one statement but the CPU executes <b>3 machine instructions</b>: load into a register, add, store back. A context switch can happen <i>between</i> them.'], ['Consequence', 'The final value depends on how the processes interleave (a race condition). We need a mechanism that orders reads/writes of shared data → the critical-section problem.']],
      exam: 'Each process has its own “register” because on a context switch the register values are <b>saved in the PCB</b>. The two processes do not overwrite each other\'s registers; they overwrite the <code>counter</code> variable in memory.',
      mount(el) {
        let S;
        const code = [['register1 = counter', 'register1 = register1 + 1', 'counter = register1'], ['register2 = counter', 'register2 = register2 - 1', 'counter = register2']];
        const init = () => ({ mem: 5, ax: null, cur: null, pcb: [null, null], pc: [0, 0], ev: null, msg: 'counter = 5. P0 will run counter++, P1 will run counter--. The correct result is 5.' });
        function act(s0, i) {
          const out = []; let s = clone(s0); if (s.pc[i] >= 3) return out;
          if (s.cur !== i) {
            if (s.cur != null) s.pcb[s.cur] = s.ax;
            const from = s.cur; s.cur = i; s.ax = s.pcb[i]; s.ev = 'cs';
            s.msg = from == null ? `The CPU starts running P${i}.` : `<span class="why-chip">context switch</span> Save P${from}'s register (= ${s.pcb[from] ?? '–'}) into PCB${from}, load P${i}'s register from PCB${i} (= ${s.ax ?? '–'}).`;
            out.push(s); s = clone(s);
          }
          const k = s.pc[i]; s.ev = 'x' + k;

          if (k === 1) { s.ax += i ? -1 : 1; s.msg = `P${i}: <code>${code[i][1]}</code> → register = ${s.ax}. Memory has <b>not</b> changed yet.`; }
          if (k === 2) { s.mem = s.ax; s.msg = `P${i}: <code>${code[i][2]}</code> → writes ${s.ax} into counter.`; }

        let pre = 'slide', bt = [];

            S = new Stage(P.viz, 900, 300);

    },
    {
      t: 'Critical section in software: Algorithms 1, 2, 3 (Peterson)',
      why: [['Khung chung', '<code>entry section → critical section → exit section → remainder section</code>. The entry/exit sections must be designed to satisfy 3 properties.'], ['3 properties', '<b>Mutual exclusion</b>: at most 1 process in the CS. <b>Progress</b>: if the CS is free and someone wants in, the choice cannot be postponed forever (processes in their remainder cannot block it). <b>Bounded waiting</b>: after requesting entry, the number of times others go first is bounded.'], ['Evolution', 'Alg 1 uses <code>turn</code> → breaks progress because it does not know whether the other side wants in. Alg 2 uses <code>flag[]</code> to know who wants in → breaks progress because both raise their flags and defer to each other forever. Alg 3 combines both: raise your flag <i>and</i> give away the turn, so <code>turn</code> arbitrates under contention → all 3 properties hold.']],
      exam: 'In Alg 3, each process sets <code>turn = k</code> (giving way to the other). Whoever writes <code>turn</code> <b>last</b> must wait. Alg 1\'s progress fails because turns are forced to alternate strictly.',
      mount(el) {
        const mk = alg => [0, 1].map(i => {
          const k = 1 - i, cs = { t: 'critical section', z: 'cs' }, rem = { t: 'remainder section', z: 'rem' };

chapter({

// ================= CHAPTER 8: MEMORY ORGANIZATION =================
chapter({
  t: 'Memory Organization', short: 'Memory Org',
  lead: 'A program must be in memory to run. The recurring question: when and how does an <b>address in the code</b> (logical) become an <b>address in RAM</b> (physical)? And how do we fit many processes into RAM without wasting space?',
  sections: [
    {
      t: 'Address binding: compile time, load time hay execution time',
      why: [['Pipeline', 'Compiler → object module → linker (adds libraries) → load module → loader (creates the process image, allocates memory, loads it into RAM).'], ['Question', 'In <code>LOAD X</code>, what kind of address is X? The <b>later</b> it is bound to a physical address, the more flexible: execution-time binding lets a running process be moved, which is the basis of compaction, swapping and paging.']],
      exam: 'Compile/load-time binding: the process image uses <b>absolute addresses</b>; legal when base ≤ addr &lt; base + limit. Execution time: uses <b>relative addresses</b>; legal when addr &lt; limit, then physical = addr + base. With execution-time binding the logical address space always starts at 0.',
      mount(el) {
        let S, mode = 'exec';
        function build() {
          const st = []; const push = (o, msg) => st.push({ ...o, msg });
          const img = mode === 'compile' ? ['…', 'JUMP 1424', 'LOAD 1824'] : ['…', 'JUMP 400', 'LOAD 800'];
          push({ img, mem: null, base: 1024 }, mode === 'compile' ? 'The compiler <b>knows in advance</b> the program will be loaded at 1024 → generates <b>absolute code</b>: LOAD 1824.' : 'The compiler generates <b>relocatable code</b> with addresses from 0: data Y at offset 800, a jump label at 400.');
          const memImg = mode === 'exec' ? img : ['…', 'JUMP 1424', 'LOAD 1824'];
          push({ img, mem: memImg, base: 1024, ld: true }, mode === 'load' ? 'The <b>loader</b> loads at 1024 and <b>adds 1024 to every address</b> in the code: 800 → 1824 (binding at load time).' : mode === 'compile' ? 'The loader copies it verbatim to exactly 1024.' : 'The loader copies the relative address (800) <b>as is</b> into memory and sets the <b>base (relocation) register = 1024</b>, limit = 1000.');
          if (mode === 'exec') push({ img, mem: memImg, base: 1024, cpu: 800, chk: 'lim', phys: 1824 }, 'The CPU executes LOAD 800: it issues logical address 800. The MMU checks 800 &lt; limit (1000), then adds base: <b>800 + 1024 = 1824</b>.');
          else push({ img, mem: memImg, base: 1024, cpu: 1824, chk: 'abs', phys: 1824 }, 'The CPU issues address 1824 (absolute). The hardware only checks 1024 ≤ 1824 &lt; 2024 and adds nothing.');
          push({ img, mem: memImg, base: 3000, moved: true }, 'The OS needs to <b>move the process</b> to 3000 (e.g. for compaction, or after swapping out and reloading elsewhere).');
          if (mode === 'exec') push({ img, mem: memImg, base: 3000, moved: true, cpu: 800, chk: 'lim', phys: 3800, ok: true }, 'Just set base = 3000. LOAD 800 → 800 + 3000 = <b>3800</b>, still the right place. <span class="ok">Execution-time binding allows relocation.</span>');
          else push({ img, mem: memImg, base: 3000, moved: true, cpu: 1824, chk: 'abs', phys: 1824, bad: true }, `The code in memory still says LOAD 1824 → points at the old area (now someone else's). <span class="bad">Wrong!</span> You must ${mode === 'compile' ? '<b>recompile</b>' : '<b>reload</b> (the loader recomputes)'}.`);
          return st;
        }
        Player(el, {
          setup(P) { P.top.append(fSel('Binding at:', [['compile', 'Compile time'], ['load', 'Load time'], ['exec', 'Execution time']], mode, v => { mode = v; P.rebuild(); })); S = new Stage(P.viz, 900, 300); }, build, base: 2000,
          render(s) {

            S.box('cpu', { x: 10, y: 190, w: 230, h: 90, cls: 'hw', html: '' });
            S.box('cpuT', { x: 20, y: 194, w: 210, h: 16, cls: 'ttl', html: 'CPU + MMU' });
            S.box('reg', { x: 20, y: 216, w: 210, h: 26, cls: 'code ' + (s.moved ? 'hl' : ''), html: mode === 'exec' ? `base=${s.base}  limit=1000` : `base=${s.base}  limit=1000` });
            if (s.cpu != null) S.box('ad', { x: 20, y: 248, w: 210, h: 26, cls: 'code ' + (s.bad ? 'bad' : s.ok ? 'ok' : 'hl'), html: s.chk === 'lim' ? `${s.cpu} &lt; 1000 ✓ → ${s.cpu}+${s.base}` : `${s.cpu} (absolute)` });
            const MX = 560, y = a => 10 + 280 * a / 4200;
            S.box('mem', { x: MX, y: 10, w: 160, h: 280, cls: 'zone', html: '' });
            [0, 1024, 2024, 3000, 4000].forEach(a => S.box('a' + a, { x: MX - 60, y: y(a) - 8, w: 54, h: 16, cls: 'lbl', html: a }));
            if (s.mem) s.mem.forEach((l, i) => S.box('m' + i, { x: MX + 6, y: y(s.base) + 6 + i * 26, w: 148, h: 22, cls: 'code user', html: l, fs: 11 }));
            if (s.mem) S.box('pr', { x: MX + 2, y: y(s.base), w: 156, h: y(1000) - y(0), cls: 'zone user', html: '', z: -1 });
            S.box('Y', { x: MX + 170, y: y(s.base + 800) - 10, w: 120, h: 20, cls: 'lbl l', html: '← data Y is here' });

    {
      t: 'Contiguous allocation, dynamic partitioning: first-fit, best-fit, worst-fit',

chapter({
  t: 'Virtual Memory', short: 'Virtual Memory',
  lead: 'Separates the size of logical memory from real RAM: a program can be larger than RAM, and only the part in use needs to be in RAM. Implemented mainly with <b>demand paging</b>: a page is loaded only when it is referenced.',
  sections: [
    {
      t: 'Demand paging: what happens on a page fault (with replacement and the dirty bit)',
      why: [['Valid–invalid bit', 'Each page-table entry has a <b>v</b> bit (page is in RAM, the entry holds the frame) or an <b>i</b> bit (not in RAM, the entry holds the disk address). Initially every entry is i. The backing store always holds the whole process image.'], ['Page fault', 'Referencing a page with bit i → trap to the OS → find a frame → read from disk → update the table → <b>restart that same instruction</b>.'], ['Dirty bit', 'When a page (the victim) must be evicted, only a <b>modified</b> page has to be written back to disk. A clean page only needs to be marked i, saving one disk write.']],

        T(['Quantum Q', '#switches', 'Efficiency'], [['Q = ∞', '1', 'T / (T + S)'], ['Q > T', '1', 'T / (T + S)'], ['S < Q < T', '⌈T/Q⌉', 'T / (T + S·⌈T/Q⌉)'], ['Q = S', '⌈T/S⌉', 'T / (T + S·⌈T/S⌉) ≈ 1/2'], ['Q → 0', '→ ∞', '→ 0']]) +
        H('Results to remember') +
        T(['Problem', 'Result'], [['FCFS, bursts 24, 3, 3', 'avg waiting = (0 + 24 + 27)/3 = <b>17</b>; order 3, 3, 24 → (6 + 0 + 3)/3 = <b>3</b>'], ['(arrival, burst) = (0,7) (2,4) (4,1) (5,4)', 'SJF = (0 + 6 + 3 + 7)/4 = <b>4</b> · SRTF = (9 + 1 + 0 + 2)/4 = <b>3</b> · SRTF dual-core = (1 + 0 + 0 + 1)/4 = <b>0.5</b>'], ['Tutorial 3 Q2, RR q = 2', 'TAT 19, 3, 8, 3, 13 · waiting 7, 2, 5, 2, 6'], ['Tutorial 3 Q2, global SRTF on 2 cores', 'TAT 13, 1, 4, 1, 7 · waiting 1, 0, 0, 0, 0']]) +
        SEE(3, 'scheduling simulator'),
        'SRTF preempts only when the newcomer’s remaining time is <b>strictly smaller</b>; on a tie the earlier arrival wins. Waiting time never includes I/O time.'),

      sec('Real-time scheduling', [['Specification', 'One-shot ⟨R, C, D⟩ and periodic ⟨T, C, D⟩ processes.'], ['Check', 'Compute U first, then draw the schedule over one hyperperiod.']],
        F(['⟨R, C, D⟩ : needs C units of CPU within [R, R + D)', '⟨T, C, D⟩ : instance k released at kT, absolute deadline = kT + D', 'U = Σ Cᵢ / Tᵢ          U > 1 ⇒ no algorithm can meet every deadline', 'EDF with D = T : schedulable ⇔ U ≤ 1', 'Hyperperiod = lcm(T₁, T₂, …)   (one hyperperiod is enough to check)']) +
        P('RM: fixed priority, <b>shorter T = higher priority</b>. The slides give no utilization test for RM, so draw the schedule; U ≤ 1 does not guarantee RM succeeds. EDF: dynamic priority by the nearest <b>absolute deadline</b>.') +
        T(['Problem', 'U', 'Result'], [['Tutorial 7 Q3: ⟨5,2,5⟩, ⟨10,3,10⟩, ⟨20,5,20⟩', '0.4 + 0.3 + 0.25 = <b>0.95</b>', 'EDF schedulable; 4 valid EDF schedules because of 3 deadline ties'], ['⟨5,2,5⟩, ⟨7,4,7⟩', '0.4 + 0.571 = <b>0.971</b>', 'RM: P2 misses at t = 7 · EDF: all deadlines met (hyperperiod 35)'], ['Slide: P1⟨10,6,10⟩, P2⟨19,4,19⟩, P3⟨20,2,14⟩', '–', 'RM: P3 misses at t = 14']]) +
        SEE(6, 'RM vs EDF'),
        'EDF compares the absolute deadline kT + D of each instance, not the parameter D.'),

      sec('Synchronization & deadlock', [['Semaphores', 'Track the value to know how many processes wait.'], ['Banker', 'Need, safety, then resource-request in four steps.']],
        F(['Wait(S)  : S.v ← S.v − 1; if S.v < 0, block in S.L', 'Signal(S): S.v ← S.v + 1; if S.v ≤ 0, wake one process from S.L', 'S.v < 0 ⇒ |S.v| = number of waiting processes', 'S.v now = S.v initial + #Signal − #Wait']) +
        T(['Purpose', 'Initial value'], [['Mutex (critical section)', '1'], ['Force A before B', '0 (A; Signal → Wait; B)'], ['Wait for k events (S3 after S1 and S2)', '0, the waiter calls Wait k times'], ['Bounded buffer of n slots', 'mutex = 1, empty = n, full = 0'], ['Dining philosophers', 'chopstick[i] = 1']]) +
        P('Race condition: <code>counter++</code> and <code>counter--</code> run concurrently on counter = 5 → result can be <b>4, 5 or 6</b>.') +
        F(['Needᵢ     = Maxᵢ − Allocationᵢ', 'Available = Total − Σ Allocationᵢ', 'Safety    : Work = Available; find unfinished i with Needᵢ ≤ Work', '            ⇒ Work ← Work + Allocationᵢ; repeat until all finish', 'Requestᵢ  : (1) Req ≤ Needᵢ (else error)   (2) Req ≤ Available (else wait)', '            (3) Available −= Req, Allocationᵢ += Req, Needᵢ −= Req', '            (4) run Safety: safe → grant; unsafe → roll back and wait']) +
        T(['Problem', 'Result'], [['Tutorial 6 Q2 (Available = 2)', 'P4 requests 1 → Available 1, every Need ≥ 2 → <b>unsafe</b> · P3 requests 1 → <b>safe</b>, ⟨P3, P2, P1, P4⟩'], ['Tutorial 6 Q3 (Available = (0, x, y, 1))', '<b>x = 2, y = 2</b>, safe sequence ⟨P1, P2, P3, P0, P4⟩'], ['Slide T0 (Available 3 3 2), P1 requests (1,0,2)', 'granted, ⟨P1, P3, P4, P0, P2⟩']]) +
        SEE(4, 'semaphores') + ' ' + SEE(5, 'Banker'),
        'Several safe sequences can all be correct. Unsafe only means deadlock is <i>possible</i>.'),

      sec('Memory: paging, page tables, TLB', [['Notation', 'Logical address m bits, page 2ⁿ bytes, RAM 2ʳ bytes, page-table entry e bytes, µ = memory access, ε = TLB lookup, α = TLB hit ratio, k = page-table levels.']],
        F(['Base/limit (absolute)     : base ≤ addr < base + limit', 'Execution-time binding    : addr < limit, physical = base + addr', 'Segmentation ⟨s, d⟩       : s < STLR and d < limit[s] ⇒ physical = base[s] + d (else trap)']) +
        F(['d = low n bits, p = high (m − n) bits', 'p = ⌊addr / 2ⁿ⌋, d = addr mod 2ⁿ', 'physical = f · 2ⁿ + d   (f = PageTable[p]),   f has r − n bits', '#entries (page table)          = 2^(m−n),   size = 2^(m−n) × e', '#entries (inverted page table) = #frames = 2^(r−n)']) +
        H('Two-level page table (each table fits one page)') +
        F(['entries per page = 2ⁿ / e  ⇒  p₂ = n − log₂ e', 'p₁ = (m − n) − p₂,   outer entries = 2^p₁ = 2^(m−n) × e / 2ⁿ', 'Tutorial 9 Q2 (p = x, d = y, e = 4): format (x − y + 2) | (y − 2) | y']) +
        H('Access time') +
        F(['no TLB = (k + 1) · µ          (one level: 2µ)', 'EAT = α (ε + µ) + (1 − α) (ε + (k + 1) µ)', 'one level: EAT = (µ + ε) α + (2µ + ε)(1 − α) = (2 − α) µ + ε']) +
        T(['Problem', 'Result'], [['Slide: 32-bit, 4 KB pages', 'p = 20 | d = 12 · table 2²⁰ × 4 B = 4 MB · two-level 10 | 10 | 12 · outer 2¹⁰ entries = 4 KB'], ['Slide: µ = 100, ε = 20, α = 0.8', 'EAT = 1.2 × 100 + 20 = <b>140 ns</b>'], ['Tutorial 8 Q2: µ = 200, TLB 75%, ε = 0', 'no TLB 400 ns · EAT = 0.75 × 200 + 0.25 × 400 = <b>250 ns</b>'], ['Tutorial 8 Q3: 32-bit, 1 KB pages, 1 GB RAM', 'p 22 | d 10 · f 20 | d 10 · 2²² entries · inverted 2²⁰'], ['32-bit, 2 KB pages, 512 MB RAM, e = 4 B', '21 | 11 · f 18 · 8 MB · two-level 12 | 9 | 11 · µ 100, ε 10, α 0.9 → <b>130 ns</b>']]) +
        P('<b>Contiguous allocation</b> (Tutorial 8 Q1, 4800-word memory): place each process at the start of a hole; leftover = hole − request. Best-fit must move 2050 words, first-fit 1200 words.') +
        SEE(8, 'memory organization'),
        'Segmentation needs d strictly less than the limit: d = limit traps. Paging removes external fragmentation but keeps internal fragmentation in the last page.'),

      sec('Virtual memory', [['Cost of a fault', 'Page-fault time is in milliseconds while a memory access is in nanoseconds, so p must be tiny.']],
        F(['EAT = (1 − p) × memory access + p × page-fault time', 'slowdown below x  ⇔  p < x · memory access / (page-fault time − memory access)', 'WSSᵢ = number of distinct pages in the last Δ references', 'D = Σ WSSᵢ,   D > m (frames) ⇒ thrashing ⇒ suspend a process']) +
        P('Slide: 200 ns access, 8 ms fault, p = 1/1000 → EAT ≈ 8.2 µs (40× slower). For less than 10% slowdown, p < 1/400 000.') +
        H('Counting page faults') +
        `<ul class="fs-ul"><li>With empty frames at the start, #faults ≥ number of distinct pages in the string.</li><li>Working set (Tutorial 10 Q2): a reference at time t faults if its page is not among the Δ references just before t.</li><li>Clock in the tutorials: a newly loaded page has R = 0; a hit sets R = 1.</li></ul>` +
        T(['Reference string', 'Frames', 'FIFO', 'OPT', 'LRU', 'Clock'], [['Slide: 1 2 3 4 1 2 5 1 2 3 4 5', '3', '9', '–', '–', '–'], ['Same string (Belady)', '4', '10', '6', '8', '8'], ['Tutorial 9 Q3: 0 1 6 0 3 4 0 1 0 3 4 6 3 4', '4', '10', '–', '7', '7'], ['2 3 2 1 5 2 4 5 3 2 5 2', '3', '9', '6', '7', '6'], ['Tutorial 10 Q2: 4 0 0 0 2 4 2 1 0 3 2', '4', '–', '–', '4', 'WS (Δ = 4): 7']]) +
        SEE(9, 'page replacement'),
        'Only FIFO suffers Belady’s anomaly. When thrashing, lower the degree of multiprogramming; never raise it.'),

      sec('File systems', [['Notation', 'B = block size, P = pointer size, n = B / P (pointers per block), LA = logical address (byte offset).']],
        F(['Contiguous: LA = B·Q + R        ⇒ block = start + Q, offset R', 'Linked    : LA = (B − P)·Q + R  ⇒ the (Q + 1)-th block in the chain, offset R + P', 'Indexed   : LA = B·Q + R        ⇒ index[Q], offset R', 'Bytes a … b lie in blocks ⌊a/B⌋ … ⌊b/B⌋']) +
        P('Reads to fetch block Q: contiguous 1 · linked Q + 1 · indexed 2 (index block + data).') +
        F(['#index blocks = (max file / B) × P / B        (128 KB, 512 B, 4 B ⇒ 256 × 4 / 512 = 2)']) +
        H('inode (D direct, 1 single, 1 double, 1 triple indirect)') +
        F(['Max file = (D + n + n² + n³) × B', 'L = ⌊LA / B⌋ :  L < D ⇒ direct', '              D ≤ L < D + n ⇒ single, entry L − D', '              D + n ≤ L < D + n + n² ⇒ double, entries ⌊(L − D − n)/n⌋ and (L − D − n) mod n']) +
        P('Disk reads for one data block (inode already in memory): direct 1 · single 2 · double 3 · triple 4. <code>seek</code> reads nothing.') +
        F(['open("/a/b/file") reads = 2 × (directories on the path, excluding root) + 1', 'bit map (bits) = disk size / B        2³⁴ / 2⁹ = 2²⁵ bits = 4 MB']) +
        T(['Problem', 'Result'], [['Slide: LA = 2333, B = 512', 'contiguous (start 19) → block 23, byte 285 · linked → 5th block (25), offset 305 · indexed → index[4], byte 285'], ['Slide: B = 4 KB, P = 4 B, 12 direct', '48 KB + 4 MB + 4 GB + 4 TB'], ['Tutorial 11 Q2: 6 direct + single, B = 1000', 'open /usr/ast/mbox = <b>5</b> · read 200 B at 5900 = <b>3</b> · 2 B entries → (6 + 500) × 1000 = <b>506 000 B</b>'], ['Tutorial 11 Q3: read 200 B from byte 1900', 'contiguous 2 · linked 3 · indexed 3'], ['10 direct + single + double, B = 2 KB, P = 4 B', '(10 + 512 + 512²) × 2048 = <b>537 939 968 B</b>']]) +
        SEE(10, 'file systems'),
        'Linked allocation stores the pointer at the start of each block, so the offset is R + P, not R.'),

      sec('Disks & RAID', [['Timing', 'Positioning (seek + rotational latency) dominates; transfer is tiny for a few sectors.'], ['Scheduling', 'Seek time ≈ seek distance, so compare total head movement.']],
        F(['T = (T_seek + T_rotational latency) + T_transfer', 'T_rotational latency = ½ × time of one rotation', 'T_transfer(N) = N / (sectors per track) × time of one rotation', 'reading a whole track = positioning + one rotation']) +
        P('Slide (seek 10 ms, rotation 8 ms, 1024 sectors/track, 512 B sectors): 4 KB = 8 sectors → 14 + 0.0625 ≈ <b>14 ms</b> · 128 KB = 256 sectors → 14 + 2 = <b>16 ms</b> · 1 MB sequential = 2 tracks × 22 ms = <b>44 ms</b>.') +
        H('Total seek distance') +
        P('Disk 0 … Max, head at h moving <b>up</b>, lowest request a, highest request b, highest request below h is c (requests on both sides). Moving down is symmetric, e.g. SCAN = h + b, LOOK = (h − a) + (b − a).') +
        F(['FCFS, SSTF = Σ |cᵢ − cᵢ₋₁| in service order', 'SCAN   = (Max − h) + (Max − a)', 'LOOK   = (b − h) + (b − a)', 'C-SCAN = (Max − h) + Max + c        (the jump back to 0 counts)', 'C-LOOK = (b − h) + (b − a) + (c − a)']) +
        T(['Problem', 'FCFS', 'SSTF', 'SCAN', 'C-SCAN', 'LOOK', 'C-LOOK'], [['Slide: h = 53, queue 98 183 37 122 14 124 65 67', '640', '236', '236 (down)', '382 (up)', '208 (down)', '322 (up)'], ['h = 100 moving up, queue 23 89 132 42 187 150 9 110', '700', '307', '289', '387', '–', '345']]) +
        P('<b>Tutorial 12 Q4</b> (seek = 20 + 0.1 × cylinders, latency 2 ms, transfer 8 ms): service time = 30 + 0.1 × distance. SSTF picks only among requests that have arrived → total 322.4 ms, average <b>32.24 ms</b>.') +
        H('RAID / volume capacity (n disks of size N)') +
        F(['M_striping (RAID 0) = N · n      M_mirroring (RAID 1) = N  (n = 2)      M_parity = N · (n − 1), n ≥ 3', 'Striping: block i lives on disk (i mod n) + 1']) +
        SEE(11, 'disk scheduling'),
        'C-SCAN and C-LOOK still count the distance of the return jump.')
    ]
  });
})();

// ================= SHELL: navigation, routing, settings =================
(function boot() {
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  const built = {}; let cur = -1;
  CHAPTERS.forEach((c, i) => nav.append(h('a', { href: '#c' + (i + 1), 'data-i': i }, h('span', { class: 'n' }, String(i + 1).padStart(2, '0')), h('span', null, c.short || c.t))));
  function buildChapter(i) {
    const c = CHAPTERS[i]; const wrap = h('div', { class: 'chap' });
    wrap.append(h('div', { class: 'ch-num' }, `CHAPTER ${i + 1} / ${CHAPTERS.length}`), h('h1', null, c.t), h('p', { class: 'ch-lead', html: c.lead }));
    if (i === 0) wrap.append(h('div', { class: 'intro-box', html: '<div><b>How to study.</b> Every section has a short “why” box (the problem that led people to invent this mechanism) and an animation that runs exactly what the OS does.</div><div><b>Controls.</b> ▶ play/pause, ◀ ▶| step back/forward, drag the bar to jump to any step, pick a speed from 0.25× to 4×. Click inside a frame, then use Space and ← →.</div><div><b>Experiment.</b> Most simulations let you edit the data (processes, reference strings, disk queues, Banker matrices…). Results are <i>actually computed</i>, not pre-drawn.</div><div><b>Exam prep.</b> “Exam trap” boxes flag the points most often asked as trick questions; every chapter ends with a multiple-choice quiz with explanations.</div>' }));
    const toc = h('nav', { class: 'toc', 'aria-label': 'Sections in this chapter' }); wrap.append(toc);
    c.sections.forEach((s, k) => { const id = `c${i + 1}-s${k + 1}`; toc.append(h('a', { href: '#' + id, onclick: e => { e.preventDefault(); document.getElementById(id).scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); } }, `${i + 1}.${k + 1} ${s.t.split(':')[0]}`)); card(wrap, { ...s, id, n: `${i + 1}.${k + 1}` }); });
    if (c.quiz) { const q = h('section', { class: 'card', id: `c${i + 1}-quiz` }); q.append(h('h2', null, h('span', { class: 'sn' }, `${i + 1}.Q`), 'Review quiz')); quizBlock(q, c.quiz); wrap.append(q); toc.append(h('a', { href: `#c${i + 1}-quiz`, onclick: e => { e.preventDefault(); q.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); } }, '✎ Review quiz')); }
    if (i < CHAPTERS.length - 1) wrap.append(h('a', { class: 'btn pri', href: '#c' + (i + 2), style: 'text-decoration:none;display:inline-block' }, `Next chapter: ${CHAPTERS[i + 1].t} →`));
    return wrap;
  }
  function show(i) {
    if (i === cur) return; PLAYERS.forEach(p => p.stop());
    main.querySelectorAll('.chap').forEach(x => x.style.display = 'none');
    if (!built[i]) { built[i] = buildChapter(i); main.append(built[i]); }
    built[i].style.display = ''; cur = i;
    nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
    document.getElementById('mtitle').textContent = `${i + 1}. ${CHAPTERS[i].short || CHAPTERS[i].t}`;
    window.scrollTo(0, 0);
    built[i].querySelectorAll('.player').forEach(() => {});
    requestAnimationFrame(() => PLAYERS.forEach(p => { if (built[i].contains(p.root)) p.show(); }));
    document.getElementById('side').classList.remove('open');
  }
  function route() { const m = /^#c(\d+)$/.exec(location.hash); const i = m ? Math.min(CHAPTERS.length, Math.max(1, +m[1])) - 1 : (cur < 0 ? 0 : cur); show(i); }
  window.addEventListener('hashchange', route); route();
  const gs = document.getElementById('gspeed'); SPEEDS.forEach(s => gs.append(h('option', { value: s }, s + '×'))); gs.value = GSPEED;
  gs.onchange = e => { GSPEED = +e.target.value; PLAYERS.forEach(p => p.setSpeed(GSPEED)); };
  const th = document.getElementById('theme');
  try { const t = localStorage.getItem('oslab-theme'); if (t) { th.value = t; document.documentElement.setAttribute('data-theme', t); } } catch (e) {}
  th.onchange = e => { const v = e.target.value; if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); try { localStorage.setItem('oslab-theme', v); } catch (err) {} };
  document.getElementById('menuBtn').onclick = () => document.getElementById('side').classList.toggle('open');
})();

</script>
